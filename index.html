<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f5" />
    <link rel="stylesheet" href="https://use.typekit.net/ezp4ayr.css" />
    <title>Craig Forbes — Design Lead</title>
  </head>
  <body>
    <script>
      // Set the theme before first paint so dark-mode visitors never see a light flash.
      (function () {
        try {
          var s = localStorage.getItem("cf-theme");
          var t =
            s === "light" || s === "dark"
              ? s
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", t);
          if (t === "dark") {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#181818");
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
