<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f5" />
    <link rel="stylesheet" href="https://use.typekit.net/ezp4ayr.css" />
    <title>Craig Forbes — Design Lead</title>
  </head>
  <body>
    <script>
      // Light is the default; dark is opt-in and applies only once the visitor
      // has chosen it. Set pre-paint so returning dark users see no light flash.
      (function () {
        try {
          if (localStorage.getItem("cf-theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#282828");
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
